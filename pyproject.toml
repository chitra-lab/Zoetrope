[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-stp"
version = "0.0.0"
description = "Anatomical-axis log-expression modeling and Fisher dynamics for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "torch>=2", "scipy", "h5py", "contourpy>=1.2"]

[project.optional-dependencies]
qian = ["scanpy"]
notebooks = ["jupyter", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
